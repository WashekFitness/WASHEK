<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Neutralize Vite HMR WebSocket in preview iframe so it never attempts a doomed connection
        // and never triggers "WebSocket closed without opened" in @vite/client
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWS = window.WebSocket;
          var SafeWS = function(url, protocols) {
            var isHmr = (
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('ais-dev-') !== -1 || url.indexOf('/@vite') !== -1))
            );
            if (isHmr) {
              var listeners = {};
              var dummy = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // WebSocket.OPEN
                url: String(url),
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  var i = listeners[type].indexOf(fn);
                  if (i !== -1) listeners[type].splice(i, 1);
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              return dummy;
            }
            return new (Function.prototype.bind.apply(NativeWS, [null].concat(Array.prototype.slice.call(arguments))))();
          };
          SafeWS.prototype = NativeWS.prototype;
          SafeWS.CONNECTING = 0;
          SafeWS.OPEN = 1;
          SafeWS.CLOSING = 2;
          SafeWS.CLOSED = 3;
          window.WebSocket = SafeWS;
        }

        function isExtensionNoise(msg, src, err) {
          var str = '';
          try {
            str = (
              String(msg || '') + ' ' +
              String(src || '') + ' ' +
              String(err && (err.stack || err.message) || '')
            );
          } catch (_) {
            str = '';
          }
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('safari-extension://') !== -1 ||
            str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            str.indexOf('MetaMask') !== -1 ||
            str.indexOf('metamask') !== -1 ||
            str.indexOf('inpage.js') !== -1 ||
            str.indexOf('Failed to connect to MetaMask') !== -1 ||
            str.indexOf('Could not establish connection') !== -1 ||
            str.indexOf('Receiving end does not exist') !== -1
          );
        }

        // Intercept console.error to prevent external extension noise from reaching frame error telemetry
        var originalConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var text = (arg && (arg.stack || arg.message)) ? (arg.stack || arg.message) : String(arg || '');
            if (isExtensionNoise(text, '', arg)) {
              return;
            }
          }
          return originalConsoleError.apply(console, arguments);
        };

        var originalConsoleWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var text = (arg && (arg.stack || arg.message)) ? (arg.stack || arg.message) : String(arg || '');
            if (isExtensionNoise(text, '', arg)) {
              return;
            }
          }
          return originalConsoleWarn.apply(console, arguments);
        };

        // DOM Level 0 error handler
        var originalOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, colNo, error) {
          if (isExtensionNoise(msg, url, error)) {
            return true;
          }
          if (typeof originalOnError === 'function') {
            return originalOnError.apply(this, arguments);
          }
          return false;
        };

        // Capture-phase error listener
        window.addEventListener('error', function(event) {
          if (isExtensionNoise(event.message, event.filename, event.error)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Capture-phase unhandled rejection listener
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason && (reason.message || reason.stack || String(reason)) || '';
          if (isExtensionNoise(msg, '', reason)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
